<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>VO2max · Al-Wathba</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#0b3d91;--blue2:#1557c0;--sky:#e8f0fb;--ink:#0f1b2d;--mute:#5b6b82;--line:#d9e2ef;
  --bg:#f3f6fb;--card:#fff;--ok:#11875d;--warn:#b7791f;--bad:#c0392b;--gold:#d4a017;
  --z1:#7fb3e6;--z2:#3aa17e;--z3:#e0b11c;--z4:#e8772e;--z5:#d23c3c;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.num,.mono{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px}
header{background:linear-gradient(120deg,#082c6b,#1557c0);color:#fff;padding:12px 16px calc(12px);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(8,44,107,.25)}
.hd{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}
.hd img{width:38px;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.hd .t{flex:1;min-width:0}
.hd .t b{display:block;font-size:18px;font-family:"Barlow Condensed","IBM Plex Sans Arabic";letter-spacing:.5px}
.hd .t span{font-size:11.5px;opacity:.8}
.hd .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
#bt-pill{display:none;align-items:center;gap:6px;background:#fff;color:var(--bad);border-radius:999px;padding:4px 10px;font-weight:700}
#bt-pill.on{display:flex}
#bt-pill .heart{animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}}
main{max-width:1100px;margin:auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px;color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--blue2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue2)}
.btn.dan{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.big{padding:14px 22px;font-size:17px;min-height:54px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12.5px;color:var(--mute);margin:0 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc1f5;border-color:var(--blue2)}
input.mono{font-size:17px;text-align:center}
.f{margin-bottom:10px}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600;background:#f7f9fc}
td input{min-height:36px;padding:6px;font-size:16px}
.tbl-wrap{overflow-x:auto}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:12px;font-weight:600}
.chip.ok{background:#e3f5ec;color:var(--ok)}.chip.warn{background:#fdf3e1;color:var(--warn)}.chip.bad{background:#fbe7e5;color:var(--bad)}
.sw{display:flex;gap:12px;align-items:center;cursor:pointer}
.sw:hover{border-color:var(--blue2)}
.av{width:46px;height:46px;border-radius:50%;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:34px;font-weight:700;line-height:1;color:var(--blue)}
.kpi .v small{font-size:15px;color:var(--mute);font-weight:500}
.kpi .l{font-size:12px;color:var(--mute);font-weight:600}
.hero{background:linear-gradient(135deg,#0b3d91,#1b66d1);color:#fff;border:none}
.hero .kpi .v{color:#fff;font-size:52px}
.hero .kpi .l,.hero .muted{color:rgba(255,255,255,.8)}
.hero .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);position:relative;margin-top:10px}
.hero .bar i{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.55);border-radius:4px}
.hero .bar b{position:absolute;top:-4px;width:4px;height:16px;background:#fff;border-radius:2px}
.est{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.est:last-child{border:none}
.zone td:first-child{font-weight:700;color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs .btn{white-space:nowrap}
.tabs .btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tlist .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tlist .it:last-child{border:none}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sky);font-size:18px;flex:none}
.note{background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 12px;font-size:13px;color:#6b5210}
.info{background:var(--sky);border:1px solid #c7d9f3;border-radius:10px;padding:10px 12px;font-size:13px;color:#16365f}
.live{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live .hr{font-size:56px;font-weight:700;color:var(--bad);line-height:1}
.live .hr small{font-size:16px;color:var(--mute)}
.runner{text-align:center;padding:20px 10px}
.runner .stage{font-size:90px;font-weight:700;line-height:1;color:var(--blue)}
.runner .meta{display:flex;justify-content:center;gap:26px;margin:14px 0;flex-wrap:wrap}
.runner .meta div{min-width:90px}
.runner .meta b{display:block;font-size:30px}
.prog{height:12px;background:var(--sky);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue2);transition:width .1s linear}
canvas{max-width:100%}
.chart{position:relative;height:260px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.login{max-width:380px;margin:40px auto;text-align:center}
.login img{width:90px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.ltr,td.num,span.num{direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
dialog{border:none;border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dlg{padding:16px}
#print{display:none}
@media (max-width:600px){
  .hero .kpi .v{font-size:44px}
  main{padding:12px 12px 90px}
  th,td{padding:6px 3px}
  .runner .stage{font-size:72px}
}
@media print{
  header,main,.toast,dialog{display:none!important}
  #print{display:block}
  body{background:#fff;font-size:12px}
  @page{size:A4;margin:12mm}
  .pg{page-break-after:always}
  .card{box-shadow:none;break-inside:avoid}
  .hero{background:#0b3d91!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .zone td:first-child{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><div class="hd">
  <img src="logo.png" alt="">
  <div class="t"><b>VO2max · AL-WATHBA</b><span id="hd-sub"></span></div>
  <div id="bt-pill" title="Polar"><span class="heart">❤</span><span id="bt-hr" class="num">--</span></div>
  <button class="btn sm" id="lang-btn" type="button">FR</button>
</div></header>
<main id="app"></main>
<div id="print"></div>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
